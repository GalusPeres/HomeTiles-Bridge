# Throwaway Home Assistant + Mosquitto for testing the Bridge (README.md).
name: hometiles-test-ha

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.4
    container_name: hometiles-test-ha
    restart: "no"
    environment:
      TZ: Europe/Berlin
      # The address the Bridge hands a panel: this Mac's LAN address (.env,
      # README.md). Inside Docker it would otherwise send the container's.
      HOMETILES_ADVERTISE_HOST: ${HOST_LAN_IP:-}
    ports:
      - "18123:8123"
      # The Bridge's direct link and camera servers, for a test panel.
      - "8140-8147:8140-8147"
      - "8124-8131:8124-8131"
    volumes:
      - ./config:/config
      - ../../custom_components/tab5_lvgl:/config/custom_components/tab5_lvgl:ro
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: hometiles-test-mqtt
    restart: "no"
    ports:
      - "11883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
